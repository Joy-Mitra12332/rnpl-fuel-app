<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RNPL Fuel Inventory</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RNPL Fuel"><meta name="theme-color" content="#14323a">
<style>
:root{--bg:#e4eaed;--card:#fff;--ink:#1a2429;--mut:#64747b;--line:#d9e0e3;--g:#2f9e6b;--o:#e0701f;--b:#2f7fd0;--p:#7a5bd0;--a:#e0a100;--r:#d6453d;--t:#14a3b8}
@media(prefers-color-scheme:dark){:root{--bg:#0d1417;--card:#172126;--ink:#e6eeef;--mut:#8ea2a8;--line:#27363c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#0f2a31,#1b5560);color:#fff;padding:16px;display:flex;align-items:center;gap:8px;border-radius:0 0 20px 20px;box-shadow:0 4px 14px #0f2a3133}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.75;display:block;font-weight:400;font-size:12px}
header button{background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:13px}
main{padding:14px 12px;max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{--c:var(--t);background:color-mix(in srgb,var(--c) 9%,var(--card));border-radius:14px;padding:12px 12px 12px 15px;position:relative;overflow:hidden;box-shadow:0 1px 3px #0f2a3114}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.k .l{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:7px}
.k .ic{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--c) 20%,transparent);font-size:15px}
.k .v{font-size:27px;font-weight:800;margin-top:6px;color:var(--c)}.k .s{color:var(--mut);font-size:12px}
.k.tap{cursor:pointer}.k.sel{outline:2px solid var(--c);box-shadow:0 4px 14px color-mix(in srgb,var(--c) 35%,transparent)}
.k.hi{grid-column:span 2;background:linear-gradient(135deg,#14323a,#1f7a78)}.k.hi::before{background:#7fe0c3}.k.hi .l,.k.hi .s{color:#cfe9e6}.k.hi .v{color:#fff;font-size:38px}.k.hi .ic{background:#ffffff26}
.c-g{--c:var(--g)}.c-o{--c:var(--o)}.c-b{--c:var(--b)}.c-p{--c:var(--p)}.c-a{--c:var(--a)}.c-r{--c:var(--r)}.c-t{--c:var(--t)}
.bar{height:7px;border-radius:5px;background:color-mix(in srgb,var(--c) 20%,transparent);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--c)}
.card,.item{background:var(--card);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0f2a3114}
.item{border-left:5px solid var(--c,var(--b))}.item b{color:var(--c,var(--b))}.card.sh{border-top:4px solid var(--c,var(--b))}.card.sh>b{color:var(--c,var(--b))}
h3{margin:18px 2px 6px;font-size:15px}.sub{color:var(--mut);margin-left:8px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row span:first-child{color:var(--mut)}.row span:last-child,.row b{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.d0{background:var(--b)}.d1{background:var(--o)}.d2{background:var(--a)}.d3{background:var(--p)}.d4{background:var(--g)}.d5{background:var(--t)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px #0f2a3114}
th,td{padding:8px 10px;text-align:right;font-size:14px}th:first-child,td:first-child{text-align:left}th{font-weight:600;font-size:12.5px;color:#fff;background:#1b5560}
th:nth-child(2){background:var(--g)}th:nth-child(3){background:var(--o)}td:nth-child(2){color:var(--g);font-weight:600}td:nth-child(3){color:var(--o);font-weight:600}
tr:nth-child(even) td{background:color-mix(in srgb,var(--t) 7%,var(--card))}
nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:740px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:4px;background:var(--card);border-radius:20px;padding:5px;box-shadow:0 6px 22px #0f2a3140}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mut);padding:7px 2px;font-size:12px;border-radius:15px}
nav button .ni{font-size:19px}nav button.on{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:700}
.login{max-width:360px;margin:12vh auto;padding:20px}.login h1{margin:0 0 4px}.login p{color:var(--mut)}
.login input{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
.login button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#14323a,#1f7a78);color:#fff;font-size:16px;margin-top:6px}
.login button:disabled{opacity:.5}.login a{display:block;margin-top:12px;color:var(--mut);text-decoration:underline}.msg{margin-top:10px;color:var(--o)}
.err{color:var(--r);font-size:13px;padding:4px 2px}.leg{font-size:12.5px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}.gg{background:var(--g)}.oo{background:var(--o)}
</style></head><body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbzstqaD8ERRTSTVr8DtJ3zT5RikyAYl4wNAxPvx1mMv27fZ8cGbmH_EJvNN4jlmMlA/exec';
const {useState,useEffect,useCallback}=React;const html=htm.bind(React.createElement);
const f=(n,d=0)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const call=p=>fetch(API+'?'+new URLSearchParams(p)).then(r=>r.json());
const K=({l,v,s,onClick,cls,on,ic,bar})=>html`<div class=${'k '+(onClick?'tap ':'')+(cls||'')+(on?' sel':'')} onClick=${onClick}><div class="l">${ic&&html`<span class="ic">${ic}</span>`}${l}</div><div class="v">${v}</div>${s&&html`<div class="s">${s}</div>`}${bar!=null&&html`<div class="bar"><i style=${{width:Math.min(100,Math.max(0,bar))+'%'}}></i></div>`}</div>`;

function Login({onOk}){
 const [email,setE]=useState(''),[code,setC]=useState(''),[step,setS]=useState(0),[msg,setM]=useState(''),[busy,setB]=useState(false);
 const go=async()=>{setB(true);setM('');try{
  if(step===0){const r=await call({action:'request',email});setM(r.msg||'');if(r.ok)setS(1)}
  else{const r=await call({action:'verify',email,code});if(r.ok){localStorage.setItem('rnpl_t',r.token);onOk(r.token)}else setM(r.msg||'Sign-in failed')}
 }catch(e){setM('No connection. Check your internet and try again.')}setB(false)};
 return html`<div class="login"><h1>RNPL Fuel Inventory</h1><p>${step===0?'Enter your authorised email to get a sign-in code.':'Enter the 6-digit code sent to your email.'}</p>
 <input type="email" autocomplete="email" placeholder="name@company.com" value=${email} disabled=${step===1} onInput=${e=>setE(e.target.value)}/>
 ${step===1&&html`<input inputmode="numeric" maxlength="6" placeholder="6-digit code" value=${code} onInput=${e=>setC(e.target.value)}/>`}
 <button disabled=${busy||!email||(step===1&&code.length<6)} onClick=${go}>${busy?'Please wait…':step===0?'Send code':'Sign in'}</button>
 ${step===1&&html`<a onClick=${()=>{setS(0);setC('');setM('')}}>Use a different email</a>`}<div class="msg">${msg}</div></div>`}

function Overview({d}){const i=d.inv,dd=parseFloat(i.days85),dc=dd<5?'c-r':dd<10?'c-a':'c-g',pl=parseFloat(i.plf)||0;return html`<div class="grid">
 <${K} cls="hi" ic="🏭" l="Closing stock (MT)" v=${f(i.close)} s=${'Usable: '+f(i.usable)+' MT'}/>
 <${K} cls="c-b" ic="📦" l="Opening stock, this month (MT)" v=${f(i.open)}/>
 <${K} cls="c-g" ic="🚢" l="Received, this month (MT)" v=${f(i.recvM)} s=${'All time: '+f(i.allR)}/>
 <${K} cls="c-o" ic="🔥" l="Consumed, this month (MT)" v=${f(i.consM)} s=${'All time: '+f(i.allC)}/>
 <${K} cls="c-t" ic="🏗️" l="Unloaded from jetty today (MT)" v=${f(i.jetty,1)}/>
 <${K} cls="c-p" ic="⚡" l="MTD plant load factor" v=${i.plf||'—'} bar=${pl}/>
 <${K} cls=${dc} ic="⏳" l="Days of stock at 85% PLF" v=${i.days85||'—'} s="Both units"/>
 <${K} cls="c-a" ic="📉" l="Days of stock at current rate" v=${i.daysNow||'—'}/></div>`}

function Daily({d}){const a=d.daily.slice(-30),mx=Math.max(1,...a.map(x=>Math.max(x.r,x.c))),w=300/(a.length||1);
 const L=[...d.daily].reverse().find(x=>x.r>0||x.c>0)||{d:"—",r:0,c:0};
 return html`<div class="grid"><${K} cls="c-g" ic="📥" l="Received, latest day (MT)" v=${f(L.r)} s=${L.d}/><${K} cls="c-o" ic="🔥" l="Consumed, latest day (MT)" v=${f(L.c)} s=${L.d}/></div><div class="card"><svg viewBox="0 0 300 126" width="100%">${a.map((x,i)=>html`<g><rect x=${i*w+.5} y=${120-x.r/mx*110} width=${w/2-.5} height=${x.r/mx*110} fill="var(--g)"/><rect x=${i*w+w/2} y=${120-x.c/mx*110} width=${w/2-.5} height=${x.c/mx*110} fill="var(--o)"/></g>`)}<line x1="0" x2="300" y1="120" y2="120" stroke="var(--line)"/></svg>
 <div class="leg"><i class="gg"></i>Received<i class="oo"></i>Consumed · last 30 days (MT)</div></div>
 <table><tr><th>Date</th><th>Received</th><th>Consumed</th><th>Balance</th></tr>${[...d.daily].reverse().map(x=>html`<tr><td>${x.d.slice(5)}</td><td>${f(x.r)}</td><td>${f(x.c)}</td><td>${f(x.b)}</td></tr>`)}</table>`}

const Item=({o,c})=>{const t=Object.keys(o).find(k=>/^Mother Vessel/.test(k));
 return html`<div class=${'item '+c}><b>${o[t]||'—'}</b><span class="sub">${o['Shipment No.']}</span>${Object.entries(o).filter(([k,v])=>k&&v&&k!=='Source row'&&k!==t&&k!=='Shipment No.').map(([k,v])=>html`<div class="row"><span>${k}</span><span>${v}</span></div>`)}</div>`};

function Vessels({d}){const v=d.ves,[sel,setSel]=useState('d');
 const L={d:['Discharging now',v.d,'c-b'],t:['Towards Bangladesh',v.t,'c-a'],u:['Upcoming laycans',v.u,'c-p']};
 return html`<div class="grid">
 <${K} cls="c-b" ic="🛳️" l="Discharging (MV)" v=${v.d.length} s=${f(v.qd)+' MT'} on=${sel==='d'} onClick=${()=>setSel('d')}/>
 <${K} cls="c-a" ic="🧭" l="Towards Bangladesh (MV)" v=${v.t.length} s=${f(v.qt)+' MT'} on=${sel==='t'} onClick=${()=>setSel('t')}/>
 <${K} cls="c-p" ic="📅" l="Upcoming laycans (MV)" v=${v.u.length} s=${f(v.qu)+' MT'} on=${sel==='u'} onClick=${()=>setSel('u')}/>
 <${K} cls="c-g" ic="🗓️" l="Next laycan starts" v=${v.next||'—'}/></div>
 <h3>${L[sel][0]}</h3>${L[sel][1].map(o=>html`<${Item} o=${o} c=${L[sel][2]}/>`)}`}

const CL=['c-b','c-o','c-a','c-p'];
function Lighters({l}){const cols=[['All running shipments',null],...l.ships.map((s,i)=>[s,i])];
 return html`${cols.map(([s,i])=>html`<div class=${'card sh '+(i===null?'c-t':CL[i%4])}><b>${s}</b>${l.rows.map((r,j)=>html`<div class="row"><span><i class=${'dot d'+j}></i>${r.label}</span><b>${i===null?r.total:r.per[i]}</b></div>`)}</div>`)}`}

class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}componentDidUpdate(p){if(p.k!==this.props.k&&this.state.e)this.setState({e:null})}render(){return this.state.e?html`<div class="err">Could not show this screen: ${String(this.state.e)}</div>`:this.props.children}}
function App(){
 const [t,setT]=useState(localStorage.getItem('rnpl_t')),[d,setD]=useState(()=>{try{return JSON.parse(localStorage.getItem('rnpl_d'))}catch(e){return null}}),[tab,setTab]=useState(0),[err,setErr]=useState(''),[busy,setB]=useState(false);
 const load=useCallback(async()=>{if(!t)return;setB(true);try{const r=await call({action:'data',token:t});
  if(r.auth===false){localStorage.removeItem('rnpl_t');setT(null)}else if(r.ok){setD(r.data);setErr('');localStorage.setItem('rnpl_d',JSON.stringify(r.data))}else setErr(r.error||'Could not load data')}
  catch(e){setErr('Offline. Showing the last saved data.')}setB(false)},[t]);
 useEffect(()=>{load();const i=setInterval(load,300000),v=()=>document.visibilityState==='visible'&&load();document.addEventListener('visibilitychange',v);return()=>{clearInterval(i);document.removeEventListener('visibilitychange',v)}},[load]);
 if(!t)return html`<${Login} onOk=${setT}/>`;
 if(!d)return html`<div class="login"><p>${err||'Loading…'}</p></div>`;
 const T=[['Overview','📊','c-b'],['Daily','📅','c-g'],['Vessels','🚢','c-a'],['Lighters','🛶','c-p']];
 return html`<header><h1>RNPL Fuel Inventory<small>Data as of ${d.asOf}</small></h1><button onClick=${load}>${busy?'…':'Refresh'}</button><button onClick=${()=>{localStorage.clear();setT(null);setD(null)}}>Sign out</button></header>
 <main>${err&&html`<div class="err">${err}</div>`}<${EB} k=${tab}>${tab===0?html`<${Overview} d=${d}/>`:tab===1?html`<${Daily} d=${d}/>`:tab===2?html`<${Vessels} d=${d}/>`:html`<${Lighters} l=${d.lighters}/>`}<//></main>
 <nav>${T.map(([n,ic,c],i)=>html`<button class=${c+(tab===i?' on':'')} onClick=${()=>setTab(i)}><span class="ni">${ic}</span>${n}</button>`)}</nav>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
